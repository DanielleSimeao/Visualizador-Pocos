name: Gerar PMTiles

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gerar-pmtiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Criar pastas
        run: |
          mkdir -p entrada
          mkdir -p saida
          mkdir -p pmtiles-bin

      - name: Localizar ultimo artifact da base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api             "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=base-amazonas-batimetria&per_page=100"             --jq '.artifacts
              | map(select(.expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].workflow_run.id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Nenhum artifact base-amazonas-batimetria foi encontrado."
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Artifact encontrado na execucao: $RUN_ID"

      - name: Baixar base batimetrica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name base-amazonas-batimetria             --dir entrada

          echo "Arquivos baixados:"
          find entrada -maxdepth 2 -type f -print

          test -f entrada/base_aprovada_com_batimetria.tif

      - name: Instalar GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

          gdalinfo --version

      - name: Gerar MBTiles
        run: |
          gdal_translate             entrada/base_aprovada_com_batimetria.tif             saida/amazonas.mbtiles             -of MBTILES             -co TILE_FORMAT=JPEG             -co QUALITY=82

          echo "MBTiles gerado:"
          ls -lh saida/amazonas.mbtiles

      - name: Gerar niveis de zoom
        run: |
          gdaladdo             -r average             saida/amazonas.mbtiles             2 4 8 16 32 64

          echo "MBTiles com overviews:"
          ls -lh saida/amazonas.mbtiles

      - name: Baixar PMTiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download             --repo protomaps/go-pmtiles             --pattern 'go-pmtiles_*_Linux_x86_64.tar.gz'             --dir pmtiles-bin

          echo "Pacote baixado:"
          ls -lh pmtiles-bin/

          tar -xzf pmtiles-bin/go-pmtiles_*_Linux_x86_64.tar.gz             -C pmtiles-bin

          PMTILES_BIN=$(find pmtiles-bin -type f -name pmtiles | head -n 1)

          if [ -z "$PMTILES_BIN" ]; then
            echo "Executavel pmtiles nao encontrado."
            exit 1
          fi

          chmod +x "$PMTILES_BIN"

          sudo install             -m 0755             "$PMTILES_BIN"             /usr/local/bin/pmtiles

          echo "PMTiles instalado:"
          pmtiles version

      - name: Converter MBTiles para PMTiles
        run: |
          pmtiles convert             saida/amazonas.mbtiles             saida/amazonas.pmtiles

          test -f saida/amazonas.pmtiles

          echo "PMTiles gerado:"
          ls -lh saida/amazonas.pmtiles

      - name: Copiar previa
        run: |
          if [ -f entrada/PREVIA_base_com_batimetria.jpg ]; then
            cp entrada/PREVIA_base_com_batimetria.jpg               saida/PREVIA_base_com_batimetria.jpg
          fi

      - name: Mostrar tamanhos finais
        run: |
          echo "Arquivos finais:"
          ls -lh saida/

          echo ""
          echo "Tamanho do PMTiles:"
          du -h saida/amazonas.pmtiles

      - name: Salvar PMTiles como artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-amazonas-pmtiles
          path: |
            saida/amazonas.pmtiles
            saida/PREVIA_base_com_batimetria.jpg
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
