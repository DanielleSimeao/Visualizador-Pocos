name: Gerar base batimetrica

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-base:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Criar pasta temporaria
        run: |
          mkdir -p dados/temporario


      - name: Baixar GEBCO da Release
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -o gebco.zip \
            "https://github.com/DanielleSimeao/Visualizador-Pocos/releases/download/gebco/GEBCO_20_Aug_2026_8e1383804eb4.zip"


      - name: Descompactar GEBCO
        run: |
          unzip -q gebco.zip -d dados/temporario

          echo "Arquivos encontrados:"

          find dados/temporario -maxdepth 3 -type f -print


      - name: Executar processamento
        run: |
          python scripts/gerar_base.py


      - name: Mostrar resultados
        run: |
          ls -lh saida/


      - name: Salvar resultados como artifact
        uses: actions/upload-artifact@v4

        with:
          name: base-amazonas-batimetria

          path: |
            saida/PREVIA_base_com_batimetria.jpg
            saida/base_aprovada_com_batimetria.tif

          retention-days: 30

          if-no-files-found: error
